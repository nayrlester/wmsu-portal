name: Deploy production (Railway + Vercel)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: .

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy:production

  railway:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - name: Redeploy cis-base-api
        if: vars.RAILWAY_SERVICE_CIS_BASE_API != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service "${{ vars.RAILWAY_SERVICE_CIS_BASE_API }}" -y
      - name: Redeploy cis-worker
        if: vars.RAILWAY_SERVICE_CIS_WORKER != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service "${{ vars.RAILWAY_SERVICE_CIS_WORKER }}" -y

  vercel:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm i -g vercel
      - name: Deploy Vercel apps (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/deploy/cloud.mjs production --push --vercel-only --skip-prepare
