services:
  postgres:
    image: postgres:16-alpine
    container_name: wmsu-cis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wmsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wmsu_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-wmsu_cis}
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - wmsu_cis_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wmsu-cis-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - wmsu_cis_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: wmsu-cis-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wmsu_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wmsu_minio_change_me}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - wmsu_cis_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    container_name: wmsu-cis-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-wmsu_minio} $${MINIO_ROOT_PASSWORD:-wmsu_minio_change_me};
      mc mb --ignore-existing local/$${MINIO_BUCKET_DOCUMENTS:-wmsu-documents};
      mc mb --ignore-existing local/$${MINIO_BUCKET_RECORDS:-wmsu-records};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wmsu_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wmsu_minio_change_me}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-wmsu-documents}
      MINIO_BUCKET_RECORDS: ${MINIO_BUCKET_RECORDS:-wmsu-records}

volumes:
  wmsu_cis_pg_data:
  wmsu_cis_redis_data:
  wmsu_cis_minio_data:
