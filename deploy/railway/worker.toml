# WMSU CIS BullMQ worker (same Railway project as Base API)
# Config-as-code path: deploy/railway/worker.toml
# No HTTP healthcheck — monitor logs / queue depth.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker.railway"
watchPatterns = ["apps/worker/**", "packages/config/**", "Dockerfile.worker.railway", "pnpm-lock.yaml"]

[deploy]
startCommand = "node dist/main.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
