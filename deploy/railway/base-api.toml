# WMSU CIS Base API (modular monolith)
# Railway project → New Service → GitHub → this repo
# Root directory: (empty = wmsu-platform)
# Config-as-code path: deploy/railway/base-api.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"
watchPatterns = ["apps/base-api/**", "Dockerfile.railway", "deploy/railway/**"]

[deploy]
startCommand = "node bin/server.js"
preDeployCommand = "node ace.js migration:run --force"
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
