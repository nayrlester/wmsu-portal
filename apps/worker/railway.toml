# Railway service: cis-worker
# Root directory: apps/worker OR repo root with Dockerfile.worker.railway

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**", "../../Dockerfile.worker.railway", "../../packages/config/**"]

[deploy]
startCommand = "node dist/main.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
