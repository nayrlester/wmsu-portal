openapi: 3.0.3
info:
  title: ULMIS API
  version: 0.2.0
  description: >
    University Library Management Information System (LibraStack) REST API.
    Covers catalog, members, circulation, reservations, fines, OPAC, portal,
    digital repository, kiosk, hardware/queue, attendance, reports, analytics,
    search, notifications, audit, AI assistant, and campus integrations.
    Human reference: docs/API-Specs-Manual.md
  contact:
    name: ULMIS Support
servers:
  - url: http://localhost:3333
    description: Local development
  - url: https://ulmis-api.example.edu
    description: Production (replace with deployed host)

tags:
  - name: Health
  - name: Docs
  - name: Authentication
  - name: Tenants
  - name: Users
  - name: Books
  - name: Catalog Import
  - name: Members
  - name: Borrowings
  - name: Reservations
  - name: Fines
  - name: Reports
  - name: Analytics
  - name: Search
  - name: Portal
  - name: OPAC
  - name: Public OPAC
  - name: Kiosk
  - name: Hardware
  - name: Digital
  - name: Attendance
  - name: Notifications
  - name: Audit
  - name: AI
  - name: Integrations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/v1/auth/login or refresh
    TenantSlug:
      type: apiKey
      in: header
      name: X-Tenant-Slug
      description: Institution slug (e.g. ulmis). Required for tenant-scoped routes.
    KioskDevice:
      type: apiKey
      in: header
      name: X-Kiosk-Api-Key
      description: >
        Kiosk plaintext API key. Also send X-Kiosk-Device-Code matching the registered device.

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SearchQ:
      name: q
      in: query
      schema:
        type: string
      description: Free-text search

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
              example: E_UNAUTHORIZED

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 900
        tokenType:
          type: string
          example: Bearer

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        tenantId:
          type: string
          format: uuid

    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        isbn13:
          type: string
        authors:
          type: array
          items:
            type: string
        category:
          type: string

    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        libraryCardNumber:
          type: string
        memberType:
          type: string
        membershipStatus:
          type: string

    Borrowing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionNumber:
          type: string
        status:
          type: string
          enum: [requested, approved, borrowed, overdue, returned, lost, cancelled]
        borrowedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time

    Reservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        reservedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    Fine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
        amountCents:
          type: integer
        paidCents:
          type: integer
        waivedCents:
          type: integer

