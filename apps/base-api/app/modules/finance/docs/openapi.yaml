openapi: 3.0.3
info:
  title: UFMS API
  description: |
    WMSU University Financial Management System — chart of accounts, cashiering,
    budget baseline, procurement, and Identity SSO.

    Interactive docs: `GET /api/v1/docs`
  version: 1.0.0
  contact:
    name: WMSU UFMS
servers:
  - url: http://127.0.0.1:3342
    description: Local development
  - url: https://{host}
    description: Deployed environment
    variables:
      host:
        default: your-api.up.railway.app

tags:
  - name: Health
  - name: Docs
  - name: Authentication
  - name: Dashboard
  - name: Organization
  - name: Campuses
  - name: Offices
  - name: Departments
  - name: Users
  - name: RBAC
  - name: Item Categories
  - name: Items
  - name: Warehouses
  - name: Stock
  - name: Suppliers
  - name: Requisitions
  - name: COA Forms
  - name: Physical Counts
  - name: Depreciation
  - name: Reports
  - name: Assets
  - name: Audit
  - name: Internal

paths:
  /health:
    get:
      tags:
        - Health
      summary: API health check with database probe
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          description: Validation error
