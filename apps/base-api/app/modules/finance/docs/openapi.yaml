components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Local UIMS access token or Identity platform access JWT (AUTH_MODE=dual|platform)
    ServiceApiKey:
      type: apiKey
      in: header
      name: X-Service-Api-Key
      description: M2M key for HRIS internal custodianship feed

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        data:
          description: Payload (object or array)
        meta:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 3600
        tokenType:
          type: string
          example: Bearer

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
          nullable: true
        platformUserId:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive, suspended]

    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        categoryId:
          type: string
          format: uuid
          nullable: true
        minStock:
          type: number
        unit:
          type: string

    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        propertyNumber:
          type: string
        name:
          type: string
        assetType:
          type: string
          enum: [equipment, furniture, vehicle, it_hardware, building, other]
        status:
          type: string
          enum: [available, assigned, maintenance, retired, disposed]

    Warehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        campusId:
          type: string
          format: uuid
          nullable: true

    CoaDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        formType:
          type: string
          enum: [ICS, PAR, RPCPPE, IIRUP, WMR]
        status:
          type: string
          enum: [draft, pending, approved, void]
        documentNumber:
          type: string
