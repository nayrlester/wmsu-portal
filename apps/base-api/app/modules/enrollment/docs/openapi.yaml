        Open deficiencies plus latest UFMS balance snapshot (cache only).
        Requires `assessments.read` or `deficiencies.read`.
      security:
        - BearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
