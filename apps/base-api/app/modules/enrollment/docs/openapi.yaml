    post:
      tags:
        - Assessments
      summary: Issue assessment form or Certificate of Registration
      operationId: postApiV1AssessmentsDocuments
      description: |
        COR requires registered enrollment. Assessment form available after prepare.
        Requires `enrollments.write` or `assessments.write`.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Document issued
          content:
            application/json:
