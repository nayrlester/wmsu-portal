openapi: 3.0.3
info:
  title: USiS Enrollment API
  description: |
    WMSU University Student Information System — admission, registration, advising,
    assessment, grades, clearance, and Identity SSO.

    Interactive docs: `GET /api/v1/docs`
  version: 1.0.0
  contact:
    name: WMSU USiS
servers:
  - url: http://127.0.0.1:3340
    description: Local development
  - url: https://{host}
    description: Deployed environment
    variables:
      host:
        default: your-api.up.railway.app

tags:
  - name: Health
  - name: Docs
  - name: Authentication
  - name: Dashboard
  - name: Organization
  - name: Campuses
  - name: Offices
  - name: Departments
  - name: Users
  - name: RBAC
  - name: Item Categories
  - name: Items
  - name: Warehouses
  - name: Stock
  - name: Suppliers
  - name: Requisitions
  - name: COA Forms
  - name: Physical Counts
  - name: Depreciation
  - name: Reports
  - name: Assets
  - name: Audit
  - name: Applicants
  - name: Students
  - name: Academic
  - name: Enrollments
  - name: Advising
  - name: Grades
  - name: Assessments
  - name: Payments
  - name: Clearance
  - name: Deficiencies
  - name: Internal

