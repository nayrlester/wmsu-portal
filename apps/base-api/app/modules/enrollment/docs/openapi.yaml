  /api/v1/assessments/{id}/submit-ufms:
    post:
      tags:
        - Assessments
      summary: Submit prepared assessment to UFMS (idempotent)
      operationId: postApiV1AssessmentsIdSubmitUfms
      description: |
        Posts assessment payload to UFMS intake. Idempotency-Key recommended.
        USiS does not create UFMS ledger rows locally. Requires `assessments.write`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Submitted or deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '502':
          description: UFMS submit failed (recorded in integration history)
  /api/v1/assessments/{id}/sync-payment-status:
    post:
      tags:
        - Assessments
      summary: Pull payment status and refs from UFMS
      operationId: postApiV1AssessmentsIdSyncPaymentStatus
      description: |
        Authoritative payment confirmation from UFMS only. Updates balance snapshot and payment mirrors.
        Does not trust SPA paid flags. Requires `assessments.write` or `payments.write`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
