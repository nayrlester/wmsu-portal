      tags:
        - Assessments
      summary: Prepare enrollment assessment (fee schedule + aid tags)
      operationId: postApiV1AssessmentsPrepare
      description: |
        USiS prepares assessment breakdown from university-approved fee schedules and aid/UniFAST tags.
        Does not post to UFMS ledger. Optional `submitToUfms` plus Idempotency-Key header.
        Requires `assessments.write` or `enrollments.write`.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        '201':
          description: Assessment prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation or advising required
  /api/v1/assessments/fee-schedules:
