      operationId: postApiV1Payments
      description: |
        Requires UFMS (`FINANCE_API_URL` or `FINANCE_MOCK`). Posts to UFMS cashier; local row is mirror only.
        Enrollment payment_verified updates only after UFMS sync confirms coverage.
        Requires `payments.write`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
