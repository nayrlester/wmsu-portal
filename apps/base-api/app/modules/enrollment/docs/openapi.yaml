  /health:
    get:
      tags:
        - Health
      summary: API health check with database probe
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          description: Validation error
