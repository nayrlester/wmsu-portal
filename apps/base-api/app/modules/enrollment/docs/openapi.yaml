          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags:
        - Assessments
      summary: Upsert university-approved fee schedule
      operationId: postApiV1AssessmentsFeeSchedules
