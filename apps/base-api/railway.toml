# Railway service: cis-base-api
# Dashboard → Root directory: apps/base-api
# Config-as-code: railway.toml (this file)
# Builder: Dockerfile (this folder)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**", "../../deploy/railway/**"]

[deploy]
startCommand = "node bin/server.js"
preDeployCommand = "node ace.js migration:run --force"
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
