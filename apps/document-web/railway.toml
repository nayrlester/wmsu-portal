# Railway service: cdts-web
# Dashboard → New Service → GitHub repo → Root directory: /web
# Set build variable VITE_API_URL to your API public URL before first deploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
numReplicas = 1
